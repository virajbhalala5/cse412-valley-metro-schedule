{% extends "base.html" %}{% block body %}
<h1>Stations</h1><p class="sub">{{ rows|length }} stations</p>
<div class="card"><form class="inline" method="get"><label>Search by name<input name="q" value="{{ term }}"></label><button>Search</button></form></div>
<table><tr><th>Station</th><th>Lines</th><th>Zone</th><th></th></tr>
{% for s in rows %}<tr><td>{{ s.name }}</td><td>{{ s.lines }}</td><td>{{ s.zone_id or '' }}</td>
<td><a href="{{ url_for('departures', station=s.station_id) }}">next trains</a></td></tr>{% endfor %}</table>{% endblock %}
