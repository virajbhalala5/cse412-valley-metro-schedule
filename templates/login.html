{% extends "base.html" %}{% block body %}
<h1>Log in</h1><p class="sub">Needed to add, edit or delete trips.</p>
<div class="card" style="max-width:380px"><form method="post" style="display:grid;gap:12px">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Username<input name="username" autofocus required></label>
<label>Password<input type="password" name="password" required></label>
<button>Log in</button></form>
<p class="note">Demo account: admin / admin123</p></div>{% endblock %}
